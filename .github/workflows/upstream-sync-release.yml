name: Upstream sync and automatic test release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if upstream has not changed
        type: boolean
        default: true
  schedule:
    - cron: '33 */6 * * *'
  push:
    paths:
      - '.github/workflows/upstream-sync-release.yml'

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge new upstream commits without deleting local workflows
        id: check
        env:
          UPSTREAM_REPO: gphoto/libgphoto2
          UPSTREAM_BRANCH: master
          TARGET_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already synchronized."
          else
            git merge --no-edit -m "chore: sync upstream $upstream_sha" "$upstream_sha"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtool libltdl-dev libusb-1.0-0-dev libexif-dev libjpeg-dev libtiff-dev libxml2-dev libcurl4-openssl-dev libgd-dev
          python -m pip install 'meson>=1.4,<2' ninja
      - name: Compile libgphoto2 with USB PTP/IP support
        run: |
          set -euo pipefail
          meson setup build --prefix=/usr --buildtype=release -Dcamlibs=ptp2 -Diolibs=libusb1,ptpip,disk
          meson compile -C build
          mkdir -p stage dist
          DESTDIR="$PWD/stage" meson install -C build --no-rebuild
          tar -czf dist/libgphoto2-ptp-linux-x86_64.tar.gz -C stage .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs: [sync, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Derive unique upstream release tag
        id: meta
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          short_sha="$(printf '%s' "$UPSTREAM_SHA" | cut -c1-12)"
          echo "tag=upstream-$short_sha" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: master
          name: "libgphoto2 automated build ${{ steps.meta.outputs.tag }}"
          prerelease: true
          generate_release_notes: false
          body: |
            Automatically synchronized from https://github.com/gphoto/libgphoto2 (branch master).
            Upstream commit: ${{ needs.sync.outputs.upstream_sha }}.
            Unofficial source build: PTP/PTP-IP Linux library files, not a standalone graphical application.
          files: dist/*
          fail_on_unmatched_files: true
